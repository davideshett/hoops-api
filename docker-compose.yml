# ─────────────────────────────────────────────────────────────────────────────
# This project talks to the shared local "infrastructure" Postgres by default
# (see ~/code/infrastructure/docker-compose.yml): host localhost:5432, database
# "hoops". That database is created once with:
#
#     docker exec postgres psql -U postgres -c "CREATE DATABASE hoops;"
#
# So the normal workflow does NOT need this file — just start the infrastructure
# stack, then `dotnet run --project src/Hoops.Api`.
#
# The service below is OPTIONAL: an isolated, throwaway Postgres for anyone who
# is NOT running the shared infrastructure stack. It's gated behind a compose
# profile so `docker compose up -d` starts nothing by default and never fights
# the infrastructure Postgres for port 5432. To use it:
#
#     docker compose --profile isolated-db up -d
#     export ConnectionStrings__Postgres="Host=localhost;Port=5442;Database=hoops;Username=hoops;Password=hoops"
# ─────────────────────────────────────────────────────────────────────────────
services:
  db:
    profiles: ["isolated-db"]
    image: postgres:16
    container_name: hoops-db
    environment:
      POSTGRES_DB: hoops
      POSTGRES_USER: hoops
      POSTGRES_PASSWORD: hoops
    # Host port 5442 (not 5432) so this can coexist with the infrastructure
    # Postgres. The container still listens on 5432 internally.
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
