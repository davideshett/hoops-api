services:
  db:
    image: postgres:16
    container_name: hoops-db
    environment:
      POSTGRES_DB: hoops
      POSTGRES_USER: hoops
      POSTGRES_PASSWORD: hoops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
